[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geotiger"
version = "0.1.0"
description = "Local-first US address geocoding from TIGER/Line address ranges"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GeoTIGER contributors" }]
keywords = ["geocoding", "tiger", "census", "duckdb", "gis"]
dependencies = [
  "duckdb>=1.0",
  "folium>=0.16",
  "geopandas>=0.14",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "pygris>=0.2",
  "rapidfuzz>=3.5",
  "shapely>=2.0",
  "typer>=0.12",
  "usaddress>=0.5.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
demo = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.9",
]

[project.scripts]
geotiger = "geotiger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geotiger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=geotiger --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
