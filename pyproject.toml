[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "geotiger"
version = "0.1.0"
description = "Local-first US address geocoding from TIGER/Line address ranges"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Wheeler", email = "andrew.wheeler@crimede-coder.com" }]
keywords = ["geocoding", "tiger", "census", "duckdb", "gis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "duckdb>=1.0",
  "folium>=0.16",
  "geopandas>=0.14",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "pygris>=0.2",
  "rapidfuzz>=3.5",
  "shapely>=2.0",
  "typer>=0.12",
  "usaddress>=0.5.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
demo = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.9",
]

[project.urls]
Homepage = "https://github.com/apwheele/geotiger"
Repository = "https://github.com/apwheele/geotiger"
Issues = "https://github.com/apwheele/geotiger/issues"
Documentation = "https://github.com/apwheele/geotiger#readme"

[project.scripts]
geotiger = "geotiger.cli:app"

# Hatchling 1.29.0 emits Core Metadata 2.4, including the SPDX license
# expression. Verified with `twine check --strict` on Twine 7.0.0. The pin
# keeps a newer Hatchling from changing the metadata version on its own.
[tool.hatch.build.targets.sdist]
only-include = ["src/geotiger", "tests"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/geotiger"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=geotiger --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
